document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

x-end;justify-content:space-between;gap:40px 56px\">\n    <div style=\"flex:1 1 520px;min-width:0\">\n      <p style=\"margin:0 0 22px;font:600 12px/1 'Public Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7A2B25\">Professor<\u002Fp>\n      <h1 style=\"margin:0;font:300 clamp(56px,9vw,124px)/0.94 'Spectral',Georgia,serif;letter-spacing:-0.025em;color:#1E1A17\">Parag Patel<span style=\"font-size:.28em;font-style:italic;font-weight:400;letter-spacing:.01em;color:#4F4741;margin-left:.45em;vertical-align:.2em\">PhD<\u002Fspan><\u002Fh1>\n      <div style=\"margin-top:36px;display:flex;flex-direction:column;gap:10px;max-width:640px\">\n        <p style=\"margin:0;font:400 clamp(21px,2.1vw,26px)/1.3 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:balance\">Dean of the Undergraduate College, Ahmedabad University<\u002Fp>\n        <p style=\"margin:0;font:400 clamp(17px,1.5vw,19px)/1.45 'Spectral',Georgia,serif;color:#4F4741;text-wrap:balance\">Associate Professor of Finance, Accounting and Control, Amrut Mody School of Management<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <figure style=\"margin:0;flex:0 0 auto;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"padding:8px;background:#FBF9F5;border:1px solid #D9D1C4\">\n        <image-slot id=\"parag-portrait\" shape=\"rect\" fit=\"cover\" placeholder=\"Portrait of Prof. Patel\" style=\"display:block;width:184px;height:237px\" src=\"61d8940e-b2e0-47b5-b1ff-0ab62f1d63d8\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <figcaption style=\"font:500 11px/1.4 'Public Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#6E655D\">Ahmedabad, Gujarat<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n  <div style=\"margin-top:clamp(56px,8vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:28px 24px\">\n    <div style=\"border-top:1px solid #1E1A17;padding-top:14px;display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Leadership<\u002Fspan>\n      <span style=\"font:400 20px/1.25 'Spectral',Georgia,serif;color:#1E1A17\">Dean, Undergraduate College<\u002Fspan>\n      <span style=\"font:400 14px/1.45 'Public Sans',sans-serif;color:#4F4741\">Ahmedabad University, since July 2025<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #1E1A17;padding-top:14px;display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Board<\u002Fspan>\n      <span style=\"font:400 20px/1.25 'Spectral',Georgia,serif;color:#1E1A17\">GIFT International Fintech Institute<\u002Fspan>\n      <span style=\"font:400 14px/1.45 'Public Sans',sans-serif;color:#4F4741\">Executive Board Member, GIFT City<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #1E1A17;padding-top:14px;display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Global<\u002Fspan>\n      <span style=\"font:400 20px/1.25 'Spectral',Georgia,serif;color:#1E1A17\">AACSB International<\u002Fspan>\n      <span style=\"font:400 14px/1.45 'Public Sans',sans-serif;color:#4F4741\">Steering Committee, Associate Deans Affinity Group, 2022–2025<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #1E1A17;padding-top:14px;display:flex;flex-direction:column;gap:8px\">\n      <span style=\"font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Industry<\u002Fspan>\n      <span style=\"font:400 20px/1.25 'Spectral',Georgia,serif;color:#1E1A17\">FICCI, CII, GCCI and AMA<\u002Fspan>\n      <span style=\"font:400 14px/1.45 'Public Sans',sans-serif;color:#4F4741\">Has chaired or served on their committees<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"profile\" data-screen-label=\"Profile\" aria-labelledby=\"h-profile\" style=\"max-width:1200px;margin:0 auto;padding:clamp(80px,11vw,140px) clamp(20px,5vw,56px) 0\">\n  <div style=\"height:4px;border-top:1px solid #1E1A17;border-bottom:1px solid #1E1A17\"><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px 56px;padding-top:28px\">\n    <div style=\"flex:1 1 240px;max-width:360px\">\n      <p style=\"margin:0;font:600 12px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Profile<\u002Fp>\n      <h2 id=\"h-profile\" style=\"margin:16px 0 0;font:400 clamp(30px,3.2vw,40px)/1.15 'Spectral',Georgia,serif;letter-spacing:-0.01em;color:#1E1A17;text-wrap:balance\">Finance, accounting and academic leadership<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"flex:2.4 1 520px;min-width:0\">\n      <p style=\"margin:0;font:300 clamp(22px,2.2vw,28px)/1.45 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:pretty\">Professor Parag Patel has over twenty-five years of experience in teaching, research, consulting and academic leadership. Before becoming Dean of the Undergraduate College at Ahmedabad University, he was Senior Associate Dean of the Amrut Mody School of Management.<\u002Fp>\n      <div style=\"margin-top:32px;columns:2 300px;column-gap:44px;font:400 18px/1.65 'Spectral',Georgia,serif;color:#4F4741\">\n        <p style=\"margin:0 0 18px;break-inside:avoid\">He is an Executive Board Member of the GIFT International Fintech Institute at GIFT City, Gandhinagar, and served a three-year term on the global steering committee of AACSB International's Associate Deans Affinity Group.<\u002Fp>\n        <p style=\"margin:0 0 18px;break-inside:avoid\">He is Vice Chairman of the H. L. College Alumni Association and has chaired or served on committees of FICCI, GCCI, CII and AMA. As a senior consultant he advised HDFC Education and Development Services, the education subsidiary of HDFC Ltd.<\u002Fp>\n        <p style=\"margin:0 0 18px;break-inside:avoid\">Beyond academia he has a deep interest in the capital markets, and in equities in particular. He has appeared as a market expert on live television shows on national channels.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top:22px;padding-top:16px;border-top:1px solid #D9D1C4;display:flex;flex-wrap:wrap;gap:8px 28px;align-items:baseline\">\n        <span style=\"font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6E655D\">Research interests<\u002Fspan>\n        <span style=\"font:italic 400 18px/1.5 'Spectral',Georgia,serif;color:#1E1A17\">Equity investment decisions<\u002Fspan>\n        <span style=\"font:italic 400 18px/1.5 'Spectral',Georgia,serif;color:#1E1A17\">Financial services<\u002Fspan>\n        <span style=\"font:italic 400 18px/1.5 'Spectral',Georgia,serif;color:#1E1A17\">Venture funding<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"career\" data-screen-label=\"Career\" aria-labelledby=\"h-career\" style=\"padding-top:clamp(56px,8vw,112px)\">\n  <div ref=\"{{ careerRef }}\" style=\"position:relative;height:{{ careerH }}\">\n    <div style=\"position:{{ innerPos }};top:0;height:{{ innerH }};max-width:1200px;margin:0 auto;padding:{{ innerPad }};display:flex;flex-direction:column\">\n      <div style=\"height:4px;border-top:1px solid #1E1A17;border-bottom:1px solid #1E1A17\"><\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 40px;padding-top:24px\">\n        <div style=\"min-width:0\">\n          <p style=\"margin:0;font:600 12px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Career<\u002Fp>\n          <h2 id=\"h-career\" style=\"margin:14px 0 0;font:400 clamp(30px,3.2vw,40px)/1.15 'Spectral',Georgia,serif;letter-spacing:-0.01em;color:#1E1A17;text-wrap:balance\">From lecturer to dean, 1999 to the present<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:300px;font:400 13.5px/1.5 'Public Sans',sans-serif;color:#6E655D\">{{ chartHint }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:28px 40px;margin-top:28px;align-items:flex-start\">\n        <div style=\"flex:1.9 1 520px;min-width:0\">\n          <div ref=\"{{ chartRef }}\" style=\"width:100%;min-height:240px\"><\u002Fdiv>\n          <div role=\"group\" aria-label=\"Select a role\" sc-camel-on-key-down=\"{{ onStopsKey }}\" style=\"display:flex;overflow-x:auto;border-top:1px solid #D9D1C4;margin-top:10px\">\n            <sc-for list=\"{{ stops }}\" as=\"s\" hint-placeholder-count=\"6\">\n              <button type=\"button\" aria-pressed=\"{{ s.pressed }}\" sc-camel-on-click=\"{{ s.onClick }}\" style=\"flex:1 0 92px;text-align:left;background:transparent;border:0;border-top:2px solid {{ s.bar }};margin-top:-1px;padding:10px 10px 4px 0;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:{{ s.color }}\" style-hover=\"color:#7A2B25\">\n                <span style=\"font:600 13px/1 'Public Sans',sans-serif;font-variant-numeric:tabular-nums\">{{ s.year }}<\u002Fspan>\n                <span style=\"font:400 12px/1.3 'Public Sans',sans-serif\">{{ s.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0;font:400 12.5px/1.5 'Public Sans',sans-serif;color:#6E655D;max-width:640px\">{{ axisNote }}<\u002Fp>\n        <\u002Fdiv>\n        <div aria-live=\"polite\" style=\"flex:1 1 300px;min-width:0;background:#EEE8DD;padding:24px 26px 26px;display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;font:600 12px/1.3 'Public Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#7A2B25\">\n            <span>{{ cur.dates }}<\u002Fspan>\n            <span style=\"color:#6E655D;font-variant-numeric:tabular-nums;letter-spacing:.04em\">{{ cur.n }} of 6<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin:4px 0 0;font:400 clamp(22px,2vw,27px)/1.2 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:balance\">{{ cur.title }}<\u002Fh3>\n          <p style=\"margin:0;font:500 14px/1.45 'Public Sans',sans-serif;color:#4F4741\">{{ cur.org }}<\u002Fp>\n          <p style=\"margin:6px 0 0;font:400 16px/1.55 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:pretty\">{{ cur.text }}<\u002Fp>\n          <sc-if value=\"{{ cur.hasAlso }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:8px;border-top:1px solid #CFC5B6;padding-top:12px\">\n              <p style=\"margin:0;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6E655D\">Also in these years<\u002Fp>\n              <ul style=\"list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ cur.also }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <li style=\"display:flex;justify-content:space-between;gap:16px;font:400 13.5px/1.4 'Public Sans',sans-serif;color:#4F4741\"><span>{{ it.name }}<\u002Fspan><span style=\"flex:0 0 auto;font-variant-numeric:tabular-nums;color:#6E655D\">{{ it.when }}<\u002Fspan><\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1200px;margin:0 auto;padding:clamp(48px,6vw,80px) clamp(20px,5vw,56px) 0\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px 56px\">\n      <div style=\"flex:1 1 240px;max-width:360px\">\n        <h3 style=\"margin:0;font:400 23px/1.3 'Spectral',Georgia,serif;color:#1E1A17\">Appointments in full<\u002Fh3>\n        <p style=\"margin:8px 0 0;font:400 14px/1.5 'Public Sans',sans-serif;color:#6E655D\">Ahmedabad University and, before it, Gujarat University.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:2.4 1 520px;min-width:0;border-top:1px solid #1E1A17\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:2px 28px;padding:14px 0;border-bottom:1px solid #D9D1C4;align-items:baseline\">\n          <div style=\"flex:1 1 320px;min-width:0\"><div style=\"font:400 18px/1.35 'Spectral',Georgia,serif;color:#1E1A17\">Dean of the Undergraduate College<\u002Fdiv><div style=\"font:400 13.5px/1.5 'Public Sans',sans-serif;color:#6E655D;margin-top:2px\">Ahmedabad University<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:0 0 170px;font:500 13.5px/1.5 'Public Sans',sans-serif;color:#4F4741;font-variant-numeric:tabular-nums;text-align:right\">Jul 2025 – present<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:2px 28px;padding:14px 0;border-bottom:1px solid #D9D1C4;align-items:baseline\">\n          <div style=\"flex:1 1 320px;min-width:0\"><div style=\"font:400 18px/1.35 'Spectral',Georgia,serif;color:#1E1A17\">Senior Associate Dean<\u002Fdiv><div style=\"font:400 13.5px/1.5 'Public Sans',sans-serif;color:#6E655D;margin-top:2px\">Amrut Mody School of Management<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:0 0 170px;font:500 13.5px/1.5 'Public Sans',sans-serif;color:#4F4741;font-variant-numeric:tabular-nums;text-align:right\">Jul 2022 – Jun 2025<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:2px 28px;padding:14px 0;border-bottom:1px solid #D9D1C4;align-items:baseline\">\n          <div style=\"flex:1 1 320px;min-width:0\"><div style=\"font:400 18px/1.35 'Spectral',Georgia,serif;color:#1E1A17\">Associate Dean, Undergraduate Programmes<\u002Fdiv><div style=\"font:400 13.5px/1.5 'Public Sans',sans-serif;color:#6E655D;margin-top:2px\">Amrut Mody School of Management<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:0 0 170px;font:500 13.5px/1.5 'Public Sans',sans-serif;color:#4F4741;font-variant-numeric:tabular-nums;text-align:right\">May 20 ground:#EEE8DD;padding:24px 26px\">\n          <p style=\"margin:0;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Note · HDFC HEADS<\u002Fp>\n          <p style=\"margin:12px 0 0;font:400 17px/1.6 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:pretty\">HDFC Education and Development Services is a wholly owned Rs. 100 crore education subsidiary of HDFC Ltd. He was part of its pioneering team of consultants, working on vocational education in financial services and on K12 schools. The first three HDFC schools operate in Gurgaon, Pune and Bangalore.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"markets\" data-screen-label=\"Markets and media\" aria-labelledby=\"h-markets\" style=\"max-width:1200px;margin:0 auto;padding:clamp(80px,11vw,140px) clamp(20px,5vw,56px) 0\">\n  <div style=\"height:4px;border-top:1px solid #1E1A17;border-bottom:1px solid #1E1A17\"><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px 56px;padding-top:28px\">\n    <div style=\"flex:1 1 240px;max-width:360px\">\n      <p style=\"margin:0;font:600 12px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Markets &amp; media<\u002Fp>\n      <h2 id=\"h-markets\" style=\"margin:16px 0 0;font:400 clamp(30px,3.2vw,40px)/1.15 'Spectral',Georgia,serif;letter-spacing:-0.01em;color:#1E1A17;text-wrap:balance\">Capital markets<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"flex:2.4 1 520px;min-width:0\">\n      <p style=\"margin:0;font:300 clamp(22px,2.2vw,28px)/1.45 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:pretty\">Beyond academia he has a deep interest in the capital markets, and in equities in particular. He has appeared as a market expert on live television shows on national channels.<\u002Fp>\n      <p style=\"margin:18px 0 0;font:400 17px/1.6 'Spectral',Georgia,serif;color:#4F4741\">His PhD, from Gujarat University, is in equity investment decisions.<\u002Fp>\n      <sc-if value=\"{{ showPh }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:40px\">\n          <p style=\"margin:0 0 12px;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#7A2B25\">Television appearances · to be supplied by Prof. Patel<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px\">\n            <div style=\"aspect-ratio:16/9;border:1px dashed #B8A898;background:repeating-linear-gradient(135deg,rgba(122,43,37,.06) 0 1px,transparent 1px 9px);display:flex;align-items:flex-end;padding:14px\"><span style=\"font:400 12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#4F4741\">Clip · channel name · date<\u002Fspan><\u002Fdiv>\n            <div style=\"aspect-ratio:16/9;border:1px dashed #B8A898;background:repeating-linear-gradient(135deg,rgba(122,43,37,.06) 0 1px,transparent 1px 9px);display:flex;align-items:flex-end;padding:14px\"><span style=\"font:400 12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#4F4741\">Clip · channel name · date<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"research\" data-screen-label=\"Teaching and research\" aria-labelledby=\"h-research\" style=\"max-width:1200px;margin:0 auto;padding:clamp(80px,11vw,140px) clamp(20px,5vw,56px) 0\">\n  <div style=\"height:4px;border-top:1px solid #1E1A17;border-bottom:1px solid #1E1A17\"><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px 56px;padding-top:28px\">\n    <div style=\"flex:1 1 240px;max-width:360px\">\n      <p style=\"margin:0;font:600 12px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Teaching &amp; research<\u002Fp>\n      <h2 id=\"h-research\" style=\"margin:16px 0 0;font:400 clamp(30px,3.2vw,40px)/1.15 'Spectral',Georgia,serif;letter-spacing:-0.01em;color:#1E1A17;text-wrap:balance\">In the classroom and in print<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"flex:2.4 1 520px;min-width:0;display:flex;flex-wrap:wrap;gap:48px 44px\">\n      <div style=\"flex:1 1 260px;min-width:0\">\n        <h3 style=\"margin:0;padding-bottom:10px;border-bottom:1px solid #1E1A17;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6E655D\">Teaching<\u002Fh3>\n        <p style=\"margin:16px 0 0;font:400 19px/1.6 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:pretty\">More than twenty-five years of teaching a wide range of accounting and finance courses in undergraduate, graduate and executive education programmes.<\u002Fp>\n        <sc-if value=\"{{ showPh }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:24px;border:1px dashed #B8A898;background:repeating-linear-gradient(135deg,rgba(122,43,37,.06) 0 1px,transparent 1px 9px);padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-height:120px;justify-content:space-between\">\n            <span style=\"font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#7A2B25\">To be supplied by Prof. Patel<\u002Fspan>\n            <span style=\"font:400 12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#4F4741\">Courses taught, by name<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"flex:1.3 1 300px;min-width:0\">\n        <h3 style=\"margin:0;padding-bottom:10px;border-bottom:1px solid #1E1A17;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6E655D\">Research<\u002Fh3>\n        <p style=\"margin:16px 0 0;font:500 12px/1.3 'Public Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E655D\">Journal article · 2024<\u002Fp>\n        <p style=\"margin:8px 0 0;font:400 22px/1.35 'Spectral',Georgia,serif;color:#1E1A17;text-wrap: -spacing:.12em;text-transform:uppercase;color:#7A2B25\">To be supplied by Prof. Patel<\u002Fspan>\n            <span style=\"font:400 12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#4F4741\">Further publications, working papers and conference talks<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"education\" data-screen-label=\"Education\" aria-labelledby=\"h-education\" style=\"max-width:1200px;margin:0 auto;padding:clamp(80px,11vw,140px) clamp(20px,5vw,56px) 0\">\n  <div style=\"height:4px;border-top:1px solid #1E1A17;border-bottom:1px solid #1E1A17\"><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px 56px;padding-top:28px\">\n    <div style=\"flex:1 1 240px;max-width:360px\">\n      <p style=\"margin:0;font:600 12px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Education<\u002Fp>\n      <h2 id=\"h-education\" style=\"margin:16px 0 0;font:400 clamp(30px,3.2vw,40px)/1.15 'Spectral',Georgia,serif;letter-spacing:-0.01em;color:#1E1A17;text-wrap:balance\">Degrees and programmes<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"flex:2.4 1 520px;min-width:0;border-top:1px solid #1E1A17\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:2px 28px;padding:16px 0;border-bottom:1px solid #D9D1C4;align-items:baseline\">\n        <div style=\"flex:1 1 320px;min-width:0\"><div style=\"font:400 20px/1.35 'Spectral',Georgia,serif;color:#1E1A17\">PhD, Equity Investment Decisions<\u002Fdiv><div style=\"font:400 14px/1.5 'Public Sans',sans-serif;color:#6E655D;margin-top:2px\">Gujarat University<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:0 0 120px;font:500 13.5px/1.5 'Public Sans',sans-serif;color:#4F4741;font-variant-numeric:tabular-nums;text-align:right\">2012 – 2017<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:2px 28px;padding:16px 0;border-bottom:1px solid #D9D1C4;align-items:b n      <div style=\"display:flex;flex-wrap:wrap;gap:2px 28px;padding:16px 0;border-bottom:3px double #1E1A17;align-items:baseline\">\n        <div style=\"flex:1 1 320px;min-width:0\"><div style=\"font:400 20px/1.35 'Spectral',Georgia,serif;color:#1E1A17\">BCom, Accountancy<\u002Fdiv><div style=\"font:400 14px/1.5 'Public Sans',sans-serif;color:#6E655D;margin-top:2px\">H. L. College of Commerce<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:0 0 120px;font:500 13.5px/1.5 'Public Sans',sans-serif;color:#4F4741;font-variant-numeric:tabular-nums;text-align:right\">1992 – 1995<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"recognition\" data-screen-label=\"Recognition\" aria-labelledby=\"h-recognition\" style=\"max-width:1200px;margin:0 auto;padding:clamp(80px,11vw,140px) clamp(20px,5vw,56px) 0\">\n  <div style=\"height:4px;border-top:1px solid #1E1A17;border-bottom:1px solid #1E1A17\"><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px 56px;padding-top:28px\">\n    <div style=\"flex:1 1 240px;max-width:360px\">\n      <p style=\"margin:0;font:600 12px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Recognition<\u002Fp>\n      <h2 id=\"h-recognition\" style=\"margin:16px 0 0;font:400 clamp(30px,3.2vw,40px)/1.15 'Spectral',Georgia,serif;letter-spacing:-0.01em;color:#1E1A17;text-wrap:balance\">Honours<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"flex:2.4 1 520px;min-width:0;border-top:1px solid #1E1A17\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 40px;padding:24px 0;border-bottom:1px solid #D9D1C4\">\n        <div style=\"flex:0 0 130px;font:600 12px/1.8 'Public Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#7A2B25\">June 2016<\u002Fdiv>\n        <div style=\"flex:1 1 340px;min-width:0\">\n          <p style=\"margin:0;font:400 clamp(21px,2vw,25px)/1.3 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:balance\">Listed among the “100 Most Influential Directors of India in Education”<\u002Fp>\n          <p style=\"margin:10px 0 0;font:400 15px/1.6 'Public Sans',sans-serif;color:#4F4741\">World Education Congress. He received the citation in Mumbai from Dr Indira Parikh.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 40px;padding:24px 0;border-bottom:3px double #1E1A17\">\n        <div style=\"flex:0 0 130px;font:600 12px/1.8 'Public Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#7A2B25\">February 2013<\u002Fdiv>\n        <div style=\"flex:1 1 340px;min-width:0\">\n          <p style=\"margin:0;font:400 clamp(21px,2vw,25px)/1.3 'Spectral',Georgia,serif;color:#1E1A17;text-wrap:balance\">Chairman's Award for Leadership, Teamwork and Innovativeness<\u002Fp>\n          <p style=\"margin:10px 0 0;font:400 15px/1.6 'Public Sans',sans-serif;color:#4F4741\">Ahmedabad University. Presented by Dr V. S. Arunachalam at the Foundation Day ceremony, for his work as Chairman of AUSEAC.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"Contact\" aria-labelledby=\"h-contact\" style=\"max-width:1200px;margin:0 auto;padding:clamp(80px,11vw,140px) clamp(20px,5vw,56px) 0\">\n  <div style=\"height:4px;border-top:1px solid #1E1A17;border-bottom:1px solid #1E1A17\"><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:20px 56px;padding-top:28px\">\n    <div style=\"flex:1 1 240px;max-width:360px\">\n      <p style=\"margin:0;font:600 12px/1 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7A2B25\">Contact<\u002Fp>\n      <h2 id=\"h-contact\" style=\"margin:16px 0 0;font:400 clamp(30px,3.2vw,40px)/1.15 'Spectral',Georgia,serif;letter-spacing:-0.01em;color:#1E1A17;text-wrap:balance\">Write, call or visit<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"flex:2.4 1 520px;min-width:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:32px 44px\">\n      <div style=\"border-top:1px solid #1E1A17;padding-top:14px\">\n        <p style=\"margin:0;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6E655D\">Email<\u002Fp>\n        <a href=\"mailto:parag.patel@ahduni.edu.in\" style=\"display:inline-block;margin-top:10px;font:400 clamp(19px,1.8vw,22px)/1.35 'Spectral',Georgia,serif;overflow-wrap:anywhere\">parag.patel@ahduni.edu.in<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1E1A17;padding-top:14px\">\n        <p style=\"margin:0;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6E655D\">Telephone<\u002Fp>\n        <a href=\"tel:+917961911121\" style=\"display:inline-block;margin-top:10px;font:400 clamp(19px,1.8vw,22px)/1.35 'Spectral',Georgia,serif;font-variant-numeric:lining-nums\">+91 79 6191 1121<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1E1A17;padding-top:14px\">\n        <p style=\"margin:0;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6E655D\">Address<\u002Fp>\n        <address style=\"margin-top:10px;font:normal 400 17px/1.55 'Spectral',Georgia,serif;color:#1E1A17\">Amrut Mody School of Management<br>Ahmedabad University, Central Campus<br>Navrangpura, Ahmedabad 380009<\u002Faddress>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1E1A17;padding-top:14px\">\n        <p style=\"margin:0;font:600 11px/1.3 'Public Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6E655D\">Elsewhere<\u002Fp>\n        <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:6px;font:500 15px/1.5 'Public Sans',sans-serif\">\n          <a href=\"https://ahduni.edu.in/academics/schools-centres/amrut-mody-school-of-management/faculty/parag-patel/\" target=\"_blank\" rel=\"noopener\">University profile<\u002Fa>\n          <a href=\"https://www.linkedin.com/in/parag-patel-phd-ahmedabad-university/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\u002Fa>\n          <a href=\"https://scholar.google.co.in/citations?user=_Qtfl1IAAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\">Google Scholar<\u002Fa>\n          <a href=\"https://orcid.org/0009-0007-8193-4129\" target=\"_blank\" rel=\"noopener\">ORCID<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"max-width:1200px;margin:0 auto;padding:clamp(80px,10vw,128px) clamp(20px,5vw,56px) 40px\">\n  <div style=\"height:4px;border-top:1px solid #1E1A17;border-bottom:1px solid #1E1A17\"><\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 32px;padding-top:18px;font:400 13px/1.55 'Public Sans',sans-serif;color:#6E655D\">\n    <span style=\"color:#1E1A17\">Professor Parag Patel, PhD<\u002Fspan>\n    <span>Concept demo prepared by Harshit Singh for Prof. Parag Patel. Not an official Ahmedabad University page.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;scrollDriven&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Career chart&quot;},&quot;showLanes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Career chart&quot;},&quot;showPlaceholders&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nconst OX = '#7A2B25', INK = '#1E1A17', INK2 = '#4F4741', INK3 = '#6E655D', RULE = '#D9D1C4', PAPER = '#F6F3EC', TINT = 'rgba(122,43,37,0.075)', STUDY = '#B9AC9B';\nconst MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst T0 = 1999, T1 = 2027, NOW = 2026 + 9.5 / 12;\nconst SANS = \"'Public Sans', system-ui, sans-serif\", SERIF = \"'Spectral', Georgia, serif\";\nconst esc = s => String(s).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;');\nconst fmt = t => { const y = Math.floor(t + 1e-6); const m = Math.min(11, Math.floor((t - y) * 12 + 1e-6)); return MONTHS[m] + ' ' + y; };\n\nclass Component extends DCLogic {\n  state = { active: 5, sticky: false, lanesShown: true };\n  careerRef = React.createRef();\n  chartRef = React.createRef();\n  head = NOW;\n\n  R = [\n    { s: 1999.5, short: 'Faculty', tiny: 'Faculty', year: '1999', dates: 'July 1999 – June 2009', title: 'Lecturer, Senior Lecturer and Assistant Professor', org: 'Department of Accountancy, H. L. Institute of Commerce, Gujarat University', text: 'A decade in the Department of Accountancy at HLIC, rising from Lecturer to Senior Lecturer and Assistant Professor.', also: [['MPhil, Accountancy, Gujarat University', '2000 – 2002']] },\n    { s: 2009.5, short: 'Head of Department', tiny: 'Head of Dept.', year: '2009', dates: 'July 2009 – April 2014', title: 'Assistant Professor and Head, Department of Accountancy', org: 'HLIC BCom Programme, Ahmedabad University', text: \"Head of the Department of Accountancy in the HLIC BCom Programme. In the university's first four years he also chaired AUSEAC and conceived the first Ahmedabad University Convocation.\", also: [['Chairman, AUSEAC', '2010 – 2014'], ['Faculty Development Programme, University of Cambridge', '2011'], ['Senior Consultant, HDFC Education and Development Services', '2011 – 2013'], [\"Chairman's Award, Ahmedabad University\", '2013']] },\n    { s: 2014 + 4 / 12, short: 'Programme Director', tiny: 'Director', year: '2014', dates: 'May 2014 – May 2016', title: 'Director, HLIC BCom Programme', org: 'Ahmedabad University', text: 'Director of the HLIC BCom Programme. In April 2014 he was appointed Associate Professor of Finance, Accounting and Control, a post he still holds.', also: [['Associate Professor, Finance, Accounting and Control', '2014 – present'], ['Vice Chairman, H. L. College Alumni Association', '2014 – present'], ['Member, Education Committee, GCCI', '2014 – 2015']] },\n    { s: 2016 + 4 / 12, short: 'Associate Dean', tiny: 'Assoc. Dean', year: '2016', dates: 'May 2016 – June 2022', title: 'Associate Dean, Undergraduate Programmes', org: 'Amrut Mody School of Management, Ahmedabad University', text: \"Six years as Associate Dean for the school's undergraduate programmes. In this period he completed his PhD in equity investment decisions and chaired FICCI's Education Committee.\", also: [['100 Most Influential Directors of India in Education', '2016'], ['PhD, Equity Investment Decisions, Gujarat University', '2017'], ['Chairman, Education Committee, FICCI', '2018 – 2019'], ['Co-Chair, Industry Academia Partnerships Committee, FICCI', '2020 – 2021']] },\n    { s: 2022.5, short: 'Senior Associate Dean', tiny: 'Sr Assoc. Dean', year: '2022', dates: 'July 2022 – June 2025', title: 'Senior Associate Dean', org: 'Amrut Mody School of Management, Ahmedabad University', text: \"Senior Associate Dean of the school. In these years he served a three-year term on the 15-member global steering committee of AACSB International's Associate Deans Affinity Group.\", also: [['Steering Committee Member, ADAG, AACSB International', '2022 – 2025'], ['Member, AMA Extension Committee', '2022 – 2025'], ['Member, Gujarat State Education Panel, CII', '2024 – 2025']] },\n    { s: 2025.5, short: 'Dean', tiny: 'Dean', year: '2025', dates: 'July 2025 – present', title: 'Dean of the Undergraduate College', org: 'Ahmedabad University', text: 'Dean of the Undergraduate College of Ahmedabad University. He continues as Associate Professor of Finance, Accounting and Control at the Amrut Mody School of Management.', also: [['Executive Board Member, GIFT International Fintech Institute', 'Current'], ['Member, Boards of Studies, KLE Technological University and Atmiya University', 'Since 2021']] }\n  ];\n  LANES = [\n    { label: 'Chairman, AUSEAC', a: 2010 + 4 / 12, b: 2014 + 4 / 12 },\n    { label: 'Sr Consultant, HDFC HEADS', a: 2011 + 8 / 12, b: 2013.5 },\n    { label: 'Associate Professor', a: 2014 + 3 / 12, b: NOW },\n    { label: 'MPhil, Accountancy', a: 2000, b: 2003, study: true },\n    { label: 'Cambridge programme', a: 2011, b: 2012, study: true },\n    { label: 'PhD', a: 2012, b: 2018, study: true }\n  ];\n\n  componentDidMount() {\n    this.mq = window.matchMedia('(prefers-reduced-motion: reduce)');\n    this.onResize = () => { this.updateMode(); this.syncScroll(); };\n    this.onScroll = () => { if (this.raf) return; this.raf = requestAnimationFrame(() => { this.raf = 0; this.syncScroll(); }); };\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    if (this.mq.addEventListener) this.mq.addEventListener('change', this.onResize);\n    if (window.ResizeObserver && this.chartRef.current) {\n      this.ro = new ResizeObserver(() => { cancelAnimationFrame(this.roRaf); this.roRaf = requestAnimationFrame(() => this.draw()); });\n      this.ro.observe(this.chartRef.current);\n    }\n    this.updateMode();\n    this.draw();\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('scroll', this.onScroll);\n    if (this.mq && this.mq.removeEventListener) this.mq.removeEventListener('change', this.onResize);\n    if (this.ro) this.ro.disconnect();\n  }\n\n  updateMode() {\n    const want = (this.props.scrollDriven ?? true) && !this.mq.matches && window.innerWidth >= 1000 && window.innerHeight >= 680;\n    this.isSticky = want;\n    if (want !== this.state.sticky) this.setState(want ? { sticky: true, active: 0 } : { sticky: false });\n    else if (!want) this.setHead(NOW);\n  }\n\n  draw() {\n    const el = this.chartRef.current; if (!el) return;\n    const W = Math.round(el.clientWidth); if (!W) return;\n    const R = this.R, n = R.length;\n    const narrow = W < 600;\n    const lanes = !narrow && (this.props.showLanes ?? true) ? this.LANES : [];\n    if ((lanes.length > 0) !== this.state.lanesShown) this.setState({ lanesShown: lanes.length > 0 });\n    const laneH = 16, axisH = 30;\n    const lanesBlock = lanes.length ? lanes.length * laneH + 22 : 0;\n    const plotH = this.isSticky ? Math.max(200, Math.min(340, window.innerHeight - 370 - lanesBlock - axisH)) : (narrow ? 230 : 300);\n    const mL = narrow ? 92 : 172, mR = narrow ? 14 : 24, mT = 34;\n    const plotB = mT + plotH;\n    const laneTop = plotB + axisH + 10;\n    const laneY = j => laneTop + j * laneH + (lanes[j].study ? 6 : 0);\n    const H = lanes.length ? laneY(lanes.length - 1) + 12 : plotB + axisH;\n    const x = t => mL + (t - T0) / (T1 - T0) * (W - mL - mR);\n    const y = l => plotB - 16 - l * (plotH - 30) / (n - 1);\n\n    let d = `M${x(R[0].s)},${y(0)}`;\n    for (let i = 1; i < n; i++) d += `H${x(R[i].s)}V${y(i)}`;\n    d += `H${x(NOW)}`;\n    const area = d + `V${plotB}H${x(R[0].s)}Z`;\n\n    let s = `<svg width=\"${W}\" height=\"${H}\" viewBox=\"0 0 ${W} ${H}\" role=\"img\" aria-label=\"Career chart, 1999 to the present: six roles held in ascending order of responsibility, from Faculty at H. L. Institute of Commerce to Dean of the Undergraduate College.\" style=\"display:block;overflow:visible;font-variant-numeric:tabular-nums\">`;\n    s += `<defs><clipPath id=\"ppClip\"><rect id=\"ppClipR\" x=\"0\" y=\"0\" width=\"${W}\" height=\"${H}\"><\u002Frect><\u002FclipPath><\u002Fdefs>`;\n    s += `<rect id=\"ppBand\" x=\"0\" y=\"${mT - 8}\" width=\"0\" height=\"${plotB - mT + 8}\" fill=\"${TINT}\"><\u002Frect>`;\n    for (let i = 0; i < n; i++) {\n      s += `<line x1=\"${mL}\" x2=\"${W - mR}\" y1=\"${y(i)}\" y2=\"${y(i)}\" stroke=\"${RULE}\" stroke-dasharray=\"1 4\"><\u002Fline>`;\n      s += `<text class=\"ppLab\" x=\"${mL - 14}\" y=\"${y(i)}\" dy=\"0.35em\" text-anchor=\"end\" font-family=\"${narrow ? SANS : SERIF}\" font-size=\"${narrow ? 11 : 15}\" fill=\"${INK3}\" style=\"transition:opacity .4s\">${esc(narrow ? R[i].tiny : R[i].short)}<\u002Ftext>`;\n    }\n    s += `<line x1=\"${mL}\" x2=\"${W - mR}\" y1=\"${plotB}\" y2=\"${plotB}\" stroke=\"${INK}\"><\u002Fline>`;\n    (narrow ? [2000, 2010, 2020] : [2000, 2005, 2010, 2015, 2020, 2025]).forEach(t => {\n      s += `<line x1=\"${x(t)}\" x2=\"${x(t)}\" y1=\"${plotB}\" y2=\"${plotB + 5}\" stroke=\"${INK}\"><\u002Fline><text x=\"${x(t)}\" y=\"${plotB + 20}\" text-anchor=\"middle\" font-family=\"${SANS}\" font-size=\"11.5\" fill=\"${INK3}\">${t}<\u002Ftext>`;\n    });\n    lanes.forEach((L, j) => {\n      s += `<text x=\"${mL - 14}\" y=\"${laneY(j)}\" dy=\"0.35em\" text-anchor=\"end\" font-family=\"${SANS}\" font-size=\"11.5\" fill=\"${INK3}\">${esc(L.label)}<\u002Ftext>`;\n      s += `<line x1=\"${mL}\" x2=\"${W - mR}\" y1=\"${laneY(j)}\" y2=\"${laneY(j)}\" stroke=\"${RULE}\" stroke-width=\"1\" opacity=\".6\"><\u002Fline>`;\n    });\n    s += `<g clip-path=\"url(#ppClip)\">`;\n    s += `<path d=\"${area}\" fill=\"${TINT}\"><\u002Fpath>`;\n    s += `<path d=\"${d}\" fill=\"none\" stroke=\"${OX}\" stroke-width=\"2\"><\u002Fpath>`;\n    s += `<path id=\"ppSeg\" d=\"\" fill=\"none\" stroke=\"${OX}\" stroke-width=\"4.5\"><\u002Fpath>`;\n    lanes.forEach((L, j) => { s += `<line x1=\"${x(L.a)}\" x2=\"${x(L.b)}\" y1=\"${laneY(j)}\" y2=\"${laneY(j)}\" stroke=\"${L.study ? STUDY : INK2}\" stroke-width=\"5\"><\u002Fline>`; });\n    s += `<\u002Fg>`;\n    R.forEach((r, i) => { s += `<circle class=\"ppPt\" cx=\"${x(r.s)}\" cy=\"${y(i)}\" r=\"5\" fill=\"${PAPER}\" stroke=\"${OX}\" stroke-width=\"2\" style=\"transition:opacity .3s\"><\u002Fcircle>`; });\n    s += `<g id=\"ppHead\" style=\"pointer-events:none\"><line id=\"ppHeadL\" y1=\"${mT - 8}\" y2=\"${plotB}\" stroke=\"${OX}\" stroke-dasharray=\"2 3\" opacity=\".55\"><\u002Fline><circle id=\"ppHeadC\" r=\"3.5\" fill=\"${OX}\"><\u002Fcircle><text id=\"ppHeadT\" y=\"${mT - 16}\" font-family=\"${SANS}\" font-size=\"11.5\" font-weight=\"600\" fill=\"${OX}\"><\u002Ftext><\u002Fg>`;\n    s += `<g id=\"ppCross\" style=\"display:none;pointer-events:none\"><line id=\"ppCrossL\" y1=\"${mT - 8}\" y2=\"${H}\" stroke=\"${INK}\" opacity=\".45\"><\u002Fline><rect id=\"ppCrossR\" y=\"${mT - 31}\" height=\"21\" fill=\"${INK}\"><\u002Frect><text id=\"ppCrossT\" y=\"${mT - 16}\" font-family=\"${SANS}\" font-size=\"11.5\" font-weight=\"500\" fill=\"${PAPER}\"><\u002Ftext><\u002Fg>`;\n    s += `<rect id=\"ppHit\" x=\"${mL - 6}\" y=\"0\" width=\"${W - mL - mR + 12}\" height=\"${H}\" fill=\"transparent\" style=\"cursor:crosshair\"><\u002Frect>`;\n    s += `<\u002Fsvg>`;\n    el.innerHTML = s;\n\n    const q = id => el.querySelector('#' + id);\n    this.geo = { W, H, mL, mR, mT, plotB, x, y, svg: el.firstChild, clip: q('ppClipR'), band: q('ppBand'), seg: q('ppSeg'), headL: q('ppHeadL'), headC: q('ppHeadC'), headT: q('ppHeadT'), cross: q('ppCross'), crossL: q('ppCrossL'), crossR: q('ppCrossR'), crossT: q('ppCrossT'), pts: [...el.querySelectorAll('.ppPt')], labs: [...el.querySelectorAll('.ppLab')] };\n    const hit = q('ppHit');\n    hit.addEventListener('mousemove', this.onMove);\n    hit.addEventListener('mouseleave', this.onLeave);\n    hit.addEventListener('click', this.onClick);\n    this.paintActive();\n    if (this.isSticky) this.syncScroll(); else this.setHead(NOW);\n  }\n\n  setHead(t) {\n    const g = this.geo; if (!g) return;\n    this.head = t;\n    const R = this.R, hx = g.x(t);\n    g.clip.setAttribute('width', Math.max(0, hx));\n    let lvl = 0;\n    R.forEach((r, i) => { const on = r.s <= t + 0.01; if (on) lvl = i; g.pts[i].style.opacity = on ? 1 : 0; g.labs[i].style.opacity = on ? 1 : 0.4; });\n    g.headC.setAttribute('cx', hx); g.headC.setAttribute('cy', g.y(lvl));\n    g.headL.setAttribute('x1', hx); g.headL.setAttribute('x2', hx);\n    g.headT.textContent = t >= NOW - 0.01 ? 'Today' : fmt(t);\n    g.headT.setAttribute('x', hx);\n    g.headT.setAttribute('te + '  ·  ' + this.R[i].short;\n    const tw = g.crossT.getComputedTextLength() + 18;\n    const tx = Math.max(g.mL - 10, Math.min(g.W - tw, cx - tw / 2));\n    g.crossR.setAttribute('x', tx); g.crossR.setAttribute('width', tw);\n    g.crossT.setAttribute('x', tx + 9);\n    g.headT.style.opacity = 0;\n  };\n  onLeave = () => { const g = this.geo; if (!g) return; g.cross.style.display = 'none'; g.headT.style.opacity = 1; };\n  onClick = (ev) => { if (!this.geo) return; this.select(this.pointer(ev).i); };\n\n  select(i) {\n    if (this.isSticky) {\n      const el = this.careerRef.current, r = el.getBoundingClientRect();\n      const span = r.height - window.innerHeight;\n      window.scrollTo({ top: r.top + window.scrollY + span * (i + 0.85) / this.R.length, behavior: 'smooth' });\n    } else this.setState({ active: i });\n  }\n  onStopsKey = (e) => {\n    const k = e.key, n = this.R.length;\n    if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(k)) return;\n    e.preventDefault();\n    const a = this.state.active;\n    const j = k === 'Home' ? 0 : k === 'End' ? n - 1 : Math.max(0, Math.min(n - 1, a + (k === 'ArrowRight' ? 1 : -1)));\n    this.select(j);\n    const b = e.currentTarget.querySelectorAll('button')[j];\n    if (b) b.focus({ preventScroll: true });\n  };\n\n  postRender() {\n    const key = [this.state.sticky, this.props.showLanes, this.props.scrollDriven].join('|');\n    if (this._modeKey !== undefined && this._modeKey !== key) {\n      const scrollChanged = this._sd !== this.props.scrollDriven;\n      this._modeKey = key; this._sd = this.props.scrollDriven;\n      if (scrollChanged) this.updateMode();\n      this.draw(); this._painted = this.state.active; return;\n    }\n    this._modeKey = key; this._sd = this.props.scrollDriven;\n    if (this._painted !== this.state.active) { this._painted = this.state.active; this.paintActive(); }\n  }\n\n  renderVals() {\n    setTimeout(() => this.postRender(), 0);\n    const a = this.state.active, r = this.R[a]
