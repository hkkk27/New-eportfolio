<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page maker</title>
<style>
    :root { --bg: #F6F3EC; --ink: #1E1A17; --accent: #7A2B25; --muted: #6E655D; --line: #D9D1C4; --card: #FBF9F5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; }
    h1 { grid-column: 1 / -1; margin: 0; font: 400 32px/1.2 Georgia, serif; }
    h1 small { display: block; margin-top: 6px; font: 400 15px/1.4 system-ui, sans-serif; color: var(--muted); }
    h2 { margin: 0 0 10px; font: 600 12px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .queue { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
    .queue li { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
    .queue button { all: unset; cursor: pointer; font-weight: 600; }
    .queue button:hover, .queue button:focus-visible { color: var(--accent); text-decoration: underline; }
    .queue a { font-size: 13px; color: var(--accent); }
    .queue .done button { color: var(--muted); font-weight: 400; }
    .queue .done::after { content: "Page made"; font-size: 12px; color: #2F6B3A; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    label span { font-weight: 400; color: var(--muted); }
    input[type=text], textarea { width: 100%; padding: 11px 12px; font: inherit; color: inherit; background: var(--card); border: 1px solid #B9AE9E; border-radius: 6px; }
    textarea { min-height: 330px; resize: vertical; font: 14px/1.5 Consolas, monospace; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .go { margin-top: 20px; padding: 13px 26px; font: 600 16px/1 system-ui, sans-serif; color: #fff; background: var(--accent); border: 0; border-radius: 6px; cursor: pointer; }
    .go[disabled] { opacity: .55; cursor: progress; }
    #out { margin-top: 22px; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
    #out:empty { display: none; }
    #out a.big { font: 400 22px/1.3 Georgia, serif; color: var(--accent); overflow-wrap: anywhere; }
    #out p { margin: 8px 0 0; }
    #out .err { color: #9B1C1C; font-weight: 600; }
    #out pre { margin: 12px 0 0; white-space: pre-wrap; font: 12.5px/1.5 Consolas, monospace; color: var(--muted); }
    .copy { margin-left: 10px; padding: 5px 12px; font: 600 13px/1 system-ui, sans-serif; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 5px; cursor: pointer; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
    <h1>Page maker <small>Paste everything about one professor, choose a photo, and get their page link.</small></h1>

    <aside>
        <h2>Professors to do</h2>
        <ul class="queue" id="queue"></ul>
    </aside>

    <form id="form">
        <label for="name">Name <span>(leave empty if the name is the first line of your text)</span></label>
        <input type="text" id="name" autocomplete="off">

        <label for="text">Everything you copied <span>(university page, LinkedIn, Google Scholar, in any order)</span></label>
        <textarea id="text" required placeholder="Paste here"></textarea>

        <label for="photo">Photo <span>(optional)</span></label>
        <input type="file" id="photo" accept="image/*">

        <div><button class="go" id="go" type="submit">Make page</button></div>
        <div id="out" aria-live="polite"></div>
    </form>
</main>

<script>
const $ = (id) => document.getElementById(id);
const out = $('out');

async function loadQueue() {
    const list = await (await fetch('/queue')).json();
    $('queue').replaceChildren(...list.map((q) => {
        const li = document.createElement('li');
        if (q.done) li.className = 'done';
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = q.name;
        b.addEventListener('click', () => { $('name').value = q.name; $('text').focus(); });
        li.append(b);
        if (q.url) {
            const a = document.createElement('a');
            a.href = q.url; a.target = '_blank'; a.rel = 'noopener';
            a.textContent = 'Open university page';
            li.append(a);
        }
        return li;
    }));
}

function show(nodes) { out.replaceChildren(...nodes); }
function el(tag, text, cls) { const n = document.createElement(tag); if (text) n.textContent = text; if (cls) n.className = cls; return n; }

$('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = $('photo').files[0];
    const photo = file ? await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); }) : '';
    $('go').disabled = true;
    $('go').textContent = 'Making the page… about a minute';
    show([el('p', 'Reading the text, building the page and publishing it.')]);
    try {
        const r = await (await fetch('/make', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: $('name').value.trim(), text: $('text').value, photo, photoName: file ? file.name : '' }) })).json();
        if (!r.ok) {
            show([el('p', r.error || 'Something went wrong.', 'err'), el('pre', r.log || '')]);
        } else {
            const a = el('a', r.url, 'big'); a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
            const c = el('button', 'Copy link', 'copy'); c.type = 'button';
            c.addEventListener('click', () => { navigator.clipboard.writeText(r.url); c.textContent = 'Copied'; });
            const head = el('p'); head.append(a, c);
            show([head, el('p', `${r.name}${r.email ? ' · ' + r.email : ''}`), el('p', r.found),
                  el('p', 'Open the page and check it against the real profile before you email the link.'), el('pre', r.log)]);
            $('name').value = ''; $('text').value = ''; $('photo').value = '';
            loadQueue();
        }
    } catch (err) {
        show([el('p', 'Could not reach the page maker. Is the black window still open?', 'err')]);
    }
    $('go').disabled = false;
    $('go').textContent = 'Make page';
});

loadQueue();
</script>
</body>
</html>
